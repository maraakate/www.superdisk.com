<html>
<body bgcolor="#FFCC00" TEXT=#000000 LINK=#C50020 VLINK=#620062 marginheight="0" marginwidth="0">
<center>

<script language="JavaScript">

function load() {

	var referred = this.document.referrer;
	
	if (navigator) {
		enteredval = referred;
		} else {
		enteredval = getParm(referred,'referredFrom');
		}
	
	parent.location = enteredval;
	
	
	alert(enteredval);
	
	
 }
 

 function replace(string,text,by) {
     // Replaces text with by in string
     var i = string.indexOf(text), newstr = '';
     if ((!i) || (i == -1))
         return string;
     newstr += string.substring(0,i) + by;
     if (i+text.length < string.length)
         newstr += replace(string.substring(i+text.length,string.length),text,by);
     return newstr;
 }
 
 function getParm(string,parm) {
     // returns value of parm from string
     var startPos = string.indexOf(parm + "=");
     if (startPos > -1) {
         startPos = startPos + parm.length + 1;
         var endPos = string.indexOf("&",startPos);
         if (endPos == -1)
             endPos = string.length;
         return unescape(string.substring(startPos,endPos));
     }
     return '';
 }
 
</script>

<a href="javascript:load();">
<img src="images/return.gif" align="middle" border="0" width="500" height="47"></a>
</center>

</body>
</html>
